<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squad Simulation — Simple3DPlayground Port</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #e5e7eb;
    }

    .shell {
      width: min(960px, calc(100vw - 32px));
      padding: 20px;
      box-sizing: border-box;
    }

    header h1,
    header p {
      margin: 0;
    }

    header p {
      color: #cbd5e1;
      margin-top: 4px;
    }

    .panel {
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.24);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 12px 0;
      font-size: 0.95rem;
    }

    .controls label {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    button,
    select,
    input {
      font: inherit;
      color: #e5e7eb;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 6px 10px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #334155;
    }

    input[type="number"] {
      width: 5.5rem;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #0f172a;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    }

    .footer {
      margin-top: 12px;
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .swatch {
      display: inline-block;
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -1px;
    }

    #status {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>Squad Simulation</h1>
      <p>A* routing, waypoint progression and flock steering on a generated tile map.</p>
    </header>

    <section class="controls panel">
      <label>
        Formation
        <select id="formation"></select>
      </label>
      <label>
        Speed
        <select id="speed">
          <option value="1">1x</option>
          <option value="2">2x</option>
          <option value="4" selected>4x</option>
          <option value="8">8x</option>
        </select>
      </label>
      <label>
        Seed
        <input id="seed" type="number" value="0" step="1">
      </label>
      <button id="regenerate" type="button">Regenerate world</button>
      <button id="reroute" type="button">New objective</button>
      <button id="pause" type="button">Pause</button>
    </section>

    <canvas id="simCanvas" width="768" height="768" aria-label="Squad simulation canvas"></canvas>

    <section class="footer panel">
      <div id="status" aria-live="polite">Loading…</div>
      <div id="legend">
        <span><span class="swatch" style="background:#4ade80"></span>agents</span>
        <span><span class="swatch" style="background:#facc15"></span>formation anchor and slots</span>
        <span><span class="swatch" style="background:#38bdf8"></span>path and active waypoint</span>
        <span><span class="swatch" style="background:#f472b6"></span>objective</span>
      </div>
    </section>
  </main>

  <script type="module" src="./src/sim-demo/main.js"></script>
</body>
</html>
